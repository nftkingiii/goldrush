# Not registered yet. base_url is the live Railway service.
# id and slug were checked as free on the devnode miner list on 2026-11-20 (re-check before registering).
version: "1"
kind: miner
id: 7310050
slug: goldrush-qld-history
protocol: generic
name: Gold Rush Queensland Mine History
description: >
  Queensland historical gold mines, geology and mining history: reported production, closure year with the
  reason quoted from the source, and ownership or tenure history, for a gold working named as the Geological
  Survey of Queensland records it (or by its GSQ site number, the same key as the survey's MINOCC record).
  Draws on the survey's full MINOCC 2017 database (production totals and dated rows in the unit recorded, years
  worked, tenure holders, company report numbers) beside curated Queensland Government and Heritage Register
  text and Geoscience Australia company data. Every figure carries its source and a quoted passage. Different
  sources keep their own values and are never merged or estimated; disagreements are listed as conflicts, and
  anything no source gives is listed under not_found. A closure reason is given only where a source states it.
  Also answers land and rights questions for a site by live point queries to the official services: mining and
  exploration tenure (tenure id, type, holder, status, grant and expiry dates), National Native Title Tribunal
  determinations, applications and ILUAs, and land status (protected areas, Queensland Heritage Register places,
  abandoned mines). Each record says whether it lies over the site point or within 2 km, and carries its source,
  query URL, record id and the time it was checked. An expiry date, or the absence of a tenure, does not show that
  ground is available. Also gives the closure-year gold price in today's US dollars (US CPI-U purchasing power).
  Also answers "what might remain today" for a site: later exploration (Geological Survey of Queensland mineral
  boreholes within 2 km, and the company report numbers the survey links to the site with title, year and report
  link), modern reported mineral resources and reserves from Geoscience Australia (tonnes, grade, category,
  reporting date, source; labelled as modern reported resources, never as gold left and kept apart from historical
  production), access and infrastructure (straight-line distance to the nearest town, major road and operational
  power line), and environmental records (environmental authorities, abandoned-mines records incl. tailings).
  Ask "what might remain at <site>" for all four, one category ("drilling near Mount Morgan", "modern resources at
  Brilliant Lode", "access and infrastructure at Gympie", "environmental records at Kidston"), or "everything about
  <site> including what might remain today" for land and rights plus all four in one call.
base_url: https://goldrush.up.railway.app

rate_limit_per_sec: 1
cache_ttl_sec: 3600
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  website: https://goldrush.up.railway.app/health

limitations:
  - code: LAND_LIVE_QUERIES
    message: Land and rights answers query the Queensland Government and National Native Title Tribunal map services at answer time (2 km buffer, cached 24 hours per site). A layer that does not answer is listed under not_found with the reason. Tenure expiry dates and the absence of a tenure do not establish that ground is available; that needs legal confirmation. Native title records are as published by the NNTT on the checked date.
  - code: REMAINING_NOT_A_RESERVE_ESTIMATE
    message: Exploration, resource, access and environment rows show what was drilled, reported, mapped or registered near the site. They are not an estimate of gold remaining and say nothing about whether a deposit is economic. Resource figures are modern reported resources as published by Geoscience Australia, not historical production. Distances are straight-line, not route distance. Source layers that do not answer, and registers with no keyless spatial layer (contaminated land, environmental management), are listed under not_found.
  - code: QUEENSLAND_GOLD_ONLY
    message: Covers the 8,132 Queensland gold workings in the Geological Survey of Queensland MINOCC record. Of those, about 2,590 have a production figure, 2,450 a whole-site gold total, 2,450 years worked and 2,050 a tenure holder or company in MINOCC 2017 (a 2017 release); for the rest the answer says not_found.
  - code: MAX_PARAM_LENGTH
    message: question must be at most 256 characters
    param: question
    property: length
    value_num: 256
    operator: lte

endpoints:
  - path: /ask
    external_path: /ask
    method: GET
    description: >
      RESEARCH_QUERY_GENERAL about one Queensland historical gold mine or lode. Answers "how much gold did
      Mount Morgan produce, when and why did it close, who owned it" with production figures (amount, unit as recorded,
      period as integer years, source and record), closure year and quoted reason, years worked, owners and tenure, the
      survey's site number (site_no), status, location and size band, conflicts between sources, and a not_found list.
      The structured fields are top-level keys of the response next to answer and sources. Also returns monthly gold prices
      when the question asks for the price of gold in a month or year. Land and rights questions ("who holds the tenure at
      Mount Morgan", "native title at Brilliant Lode", "land status of site 494270", "everything about land and rights at
      Mount Morgan") return tenure, native_title and land_status rows, each with source_ref, source_url, record id, whether it
      contains the site point or lies within 2 km, and checked_at, plus a fixed caveat. "Gold price at closure vs today for
      Brilliant Lode" returns gold_price_real: the closure-year price and the same amount in today's US dollars (US CPI-U).
      "What might remain at Ravenswood" returns exploration (boreholes within 2 km, company reports linked by MINOCC),
      resources (modern reported resources and reserves, labelled), access (nearest town, major road and power line,
      straight line) and environment (environmental authorities, abandoned-mines records) rows, each with source_ref,
      source_url, record id, relation (within_buffer, linked_by_minocc, nearest_straight_line or contains_site_point)
      and checked_at, plus fixed caveats. "Drilling near Mount Morgan", "modern resources at Brilliant Lode", "access
      and infrastructure at Gympie" and "environmental records at Kidston" return one category. "Everything about Mount
      Morgan including what might remain today" returns land and rights plus all four in one call.
    intents: [RESEARCH_QUERY_GENERAL]
    params:
      query:
        required:
          - name: question
            type: string
            intents: ["*"]
            description: "The research question, at most 256 characters. Name one Queensland gold mine or lode as the Geological Survey of Queensland records it, for example: Tell me about the Mount Morgan gold mine, Queensland: who owned it, how much gold it produced, and when and why it closed. Or give 'site 494270'."

input_schema:
  type: object
  required: [question]
  properties:
    question:
      type: string
      description: A question about one Queensland historical gold mine, by name or GSQ site number.

semantics:
  signal_mapping:
    label_field: brief
  supported_intents:
    - RESEARCH_QUERY_GENERAL

intent_mapping:
  RESEARCH_QUERY_GENERAL:
    endpoint: /ask
    input:
      question: { from: question }
    output:
      answer: { path: answer }
      source_count: { path: source_count }
      sources: { path: sources }
